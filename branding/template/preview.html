<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parent brand — agent-project-bootstrap</title>
<style>
body { margin: 0; font-family: system-ui, sans-serif; background: #e8eef2; color: #0f1419; padding: 24px; }
h1 { font-size: 1.25rem; }
h2 { font-size: 1rem; margin-top: 2rem; }
.mark { background: #fff; padding: 24px; display: inline-block; border-radius: 8px; }
.panel { background: #fff; padding: 12px; border-radius: 8px; max-width: 100%; }
img { max-width: 100%; height: auto; display: block; }
.swatch { display: inline-block; width: 72px; height: 48px; border-radius: 6px; margin-right: 8px; vertical-align: middle; }
label { font-size: 0.85rem; margin-right: 16px; }
</style>
</head>
<body>
<h1>agent-project-bootstrap — Human ↔ agent handshake</h1>
<p>Ink #0F1419 · amber #E8A317 · mist #E8EEF2</p>
<p>
<span class="swatch" style="background:#0F1419"></span><label>ink</label>
<span class="swatch" style="background:#E8A317"></span><label>amber</label>
<span class="swatch" style="background:#E8EEF2;border:1px solid #ccc"></span><label>mist</label>
</p>
<h2>Logo (2D)</h2>
<div class="mark"><img src="logo-mark.png" width="192" height="192" alt="2D handshake logo"></div>
<h2>Lockup</h2>
<div class="mark"><img src="logo-lockup.png" width="480" alt="Lockup"></div>
<h2>README splash (photoreal)</h2>
<div class="panel"><img src="readme-splash.jpg" width="720" alt="README splash"></div>
<h2>Social / OG</h2>
<div class="panel"><img src="social-preview.jpg" width="640" alt="Social preview"></div>
</body>
</html>
